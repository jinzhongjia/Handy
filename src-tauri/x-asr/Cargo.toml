[package]
name = "handy-x-asr"
version = "0.1.0"
edition = "2021"
license = "MIT"
links = "handy_xasr"
build = "build.rs"

[dependencies]
anyhow = "1"
log = "0.4"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "alternative-backend", "api-24"] }

[build-dependencies]
cmake = "0.1"
shlex = "1"
flate2 = "1"
tar = "0.4"
serde_json = "1"

[dev-dependencies]
hound = "3.5"
